# Elegant
[buildPlans.Elegant]
family = "Elegant"
spacing = "fontconfig-mono"
serifs = "sans"
noCvSs = true
exportGlyphNames = false
buildTextureFeature = true

[buildPlans.Elegant.metricOverride]
leading = 1450
ascender = 750
xHeight = 540

[buildPlans.Elegant.variants]
inherits = "ss14"

[buildPlans.Elegant.variants.design]
lig-neq = "more-slanted-dotted"
lig-equal-chain = "without-notch"
lig-double-arrow-bar = "without-notch"
lig-hyphen-chain = "without-notch"
lig-plus-chain = "without-notch"
lig-ltgteq = "flat"
asterisk = "penta-low"
percent = "rings-continuous-slash"
paren = "normal"
zero = "dotted"
one = "no-base"
two = "straight-neck-serifless"
three = "flat-top-serifless"
four = "closed-non-crossing-serifless"
five = "upright-flat-serifless"
seven = "straight-serifless"
eight = "two-circles"
i = "serifed-flat-tailed"

[buildPlans.Elegant.weights.Light]
shape = 300
menu = 300
css = 300

[buildPlans.Elegant.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.Elegant.weights.Medium]
shape = 500
menu = 500
css = 500

[buildPlans.Elegant.weights.SemiBold]
shape = 600
menu = 600
css = 600

[buildPlans.Elegant.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.Elegant.widths.Normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.Elegant.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.Elegant.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"

[buildPlans.Elegant.ligations]
inherits = "javascript"
disables = [
  "brace-bar",
  "brack-bar",
  "llgg",
  "llggeq",
  "logic",
  "slash-asterisk"
]
enables = [
  "arrow-l",
  "arrow-lr",
  "arrow-r",
  "brst",
  "center-ops",
  "center-op-trigger-plus-minus-l",
  "center-op-trigger-plus-minus-r",
  "center-op-trigger-equal-l",
  "center-op-trigger-equal-r",
  "center-op-influence-colon",
  "center-op-influence-dot",
  "center-op-trigger-angle-inside",
  "center-op-trigger-angle-outside",
  "center-op-trigger-bar-l",
  "center-op-trigger-bar-r",
  "center-op-trigger-equal-l",
  "center-op-trigger-equal-r",
  "counter-arrow-l",
  "counter-arrow-r",
  "eqeqeq",
  "eqlt",
  "eqeq",
  "exeq",
  "exeqeq",
  "gteq",
  "hash-hash",
  "html-comment",
  "kern-bars",
  "kern-dotty",
  "lteq",
  "ltgt-diamond-tag",
  "ltgt-slash-tag",
  "minus-minus-minus",
  "plus-plus-plus",
  "underscore-underscore-underscore" ]


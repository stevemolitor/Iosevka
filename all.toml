# Iosevka Menlo
[buildPlans.IosevkaMenlo]
family = "Iosevka Menlo"
spacing = "normal"
serifs = "sans"
noCvSs = true
exportGlyphNames = false

  [buildPlans.IosevkaMenlo.variants]
  inherits = "ss04"

    [buildPlans.IosevkaMenlo.variants.design]
    at = "threefold-tall"    
    brace = "curly-flat-boundary"
    dollar = "open"
    five = "upright-flat-serifless"
    four = "closed-serifless"
    g = "double-storey"
    lig-neq = "slightly-slanted-dotted"
    lower-lambda = "tailed-turn"
    one = "no-base-long-top-serif"
    zero = "dotted"

  [buildPlans.IosevkaMenlo.ligations]
  inherits = "dlig"

# Iosevka Menlo Term
[buildPlans.IosevkaMenloTerm]
family = "Iosevka Menlo Term"
spacing = "term"
serifs = "sans"
noCvSs = true
exportGlyphNames = false

  [buildPlans.IosevkaMenloTerm.variants]
  inherits = "ss04"

    [buildPlans.IosevkaMenloTerm.variants.design]
    brace = "curly"
    dollar = "open"
    g = "double-storey"
    lig-neq = "slightly-slanted-dotted"
    zero = "dotted"
    one = "no-base-long-top-serif"
    four = "closed-serifless"
    five = "upright-flat-serifless"    

  [buildPlans.IosevkaMenloTerm.ligations]
  inherits = "dlig"


# Iosevka Steve Narrow
[buildPlans.IosevkaSteveNarrow]
family = "Iosevka Steve Narrow"
spacing = "normal"
serifs = "sans"
noCvSs = true
exportGlyphNames = false

[buildPlans.IosevkaSteveNarrow.widths.Condensed]
shape = 420
menu = 3
css = "condensed"

[buildPlans.IosevkaSteveNarrow.widths.Normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.IosevkaSteveNarrow.variants.design]
asterisk = "hex-low"
at = "fourfold"
b = "toothed-serifless"
bar = "natural-slope"
brace = "curly"
capital-d = "more-rounded-serifless"
capital-g = "toothless-corner-serifless-hooked"
capital-i = "serifed" 
capital-j = "serifless"
capital-q = "straight"
capital-r = "curly-serifless"
d = "toothed-serifless"
dollar = "open"
f = "flat-hook-serifless"
four = "closed-serifless"
# g = "single-storey-serifless"
g = "double-storey"
i = "serifed-flat-tailed"
j = "flat-hook-serifed"
l = "serifed-flat-tailed"
lig-neq = "slightly-slanted-dotted"
# lig-equal-chain = "without-notch"
# lig-hyphen-chain = "without-notch"
m = "short-leg-serifless"
one = "base"
p = "eared-serifless"
paren = "normal"
percent = "rings-continuous-slash"
q = "straight-serifless"
r = "serifless"
t = "flat-hook"
u = "toothed-serifless"
underscore = "low"
w = "curly-serifless"
y = "straight-turn-serifless"
zero = "dotted"

  [buildPlans.IosevkaSteveNarrow.ligations]
  inherits = "javascript"
  enables = ["eqeqeq", "exeqeq"]

# Iosevka Steve Narrow Term
[buildPlans.IosevkaSteveNarrowTerm]
family = "Iosevka Steve Narrow Term"
spacing = "term"
serifs = "sans"
noCvSs = true

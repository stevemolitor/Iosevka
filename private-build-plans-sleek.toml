# Sleek
[buildPlans.IosevkaSleek]
family = "Iosevka Sleek"
spacing = "fontconfig-mono"
serifs = "sans"
noCvSs = true
exportGlyphNames = false
buildTextureFeature = true

[buildPlans.IosevkaSleek.metricOverride]
leading = 1450

[buildPlans.IosevkaSleek.variants.design]
capital-q = "crossing"
f = "flat-hook-serifless"
i = "hooky"
l = "serifed-flat-tailed"
t = "flat-hook"
asterisk = "penta-low"
lig-neq = "more-slanted-dotted"
lig-equal-chain = "without-notch"
lig-double-arrow-bar = "without-notch"
lig-hyphen-chain = "without-notch"
lig-plus-chain = "without-notch"
g = "single-storey-flat-hook-serifless"
four = "closed-serifless"

[buildPlans.IosevkaSleek.variants.italic]
capital-q = "curly-tailed"
f = "flat-hook-tailed"
g = "double-storey"
t = "bent-hook"
asterisk = "penta-low"

[buildPlans.IosevkaSleek.weights.Light]
shape = 300
menu = 300
css = 300

[buildPlans.IosevkaSleek.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaSleek.weights.Medium]
shape = 500
menu = 500
css = 500

[buildPlans.IosevkaSleek.weights.SemiBold]
shape = 600
menu = 600
css = 600

[buildPlans.IosevkaSleek.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.IosevkaSleek.widths.Normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.IosevkaSleek.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaSleek.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"

[buildPlans.IosevkaSleek.ligations]
inherits = "javascript"
disables = [
  "brace-bar",
  "brack-bar",
  "llgg",
  "llggeq",
  "logic",
  "slash-asterisk"
]
enables = [
  "arrow-l",
  "arrow-lr",
  "arrow-r",
  "brst",
  "center-ops",
  "center-op-trigger-plus-minus-l",
  "center-op-trigger-plus-minus-r",
  "center-op-trigger-equal-l",
  "center-op-trigger-equal-r",
  "center-op-influence-colon",
  "center-op-influence-dot",
  "center-op-trigger-angle-inside",
  "center-op-trigger-angle-outside",
  "center-op-trigger-bar-l",
  "center-op-trigger-bar-r",
  "center-op-trigger-equal-l",
  "center-op-trigger-equal-r",
  "counter-arrow-l",
  "counter-arrow-r",
  "eqeqeq",
  "eqlt",
  "eqeq",
  "exeq",
  "exeqeq",
  "gteq",
  "hash-hash",
  "html-comment",
  "kern-bars",
  "kern-dotty",
  "lteq",
  "ltgt-diamond-tag",
  "ltgt-slash-tag",
  "minus-minus-minus",
  "plus-plus-plus",
  "underscore-underscore-underscore" ]


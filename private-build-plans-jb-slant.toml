# JBSlant
[buildPlans.IosevkaJBSlant]
family = "Iosevka JBSlant"
spacing = "fontconfig-mono"
serifs = "sans"
noCvSs = true
exportGlyphNames = false
buildTextureFeature = true

[buildPlans.IosevkaJBSlant.metricOverride]
leading = 1450
ascender = 750
xHeight = 540

[buildPlans.IosevkaJBSlant.variants]
inherits = "ss14"

[buildPlans.IosevkaJBSlant.variants.design]
lig-neq = "more-slanted-dotted"
lig-equal-chain = "without-notch"
lig-double-arrow-bar = "without-notch"
lig-hyphen-chain = "without-notch"
lig-plus-chain = "without-notch"
lig-ltgteq = "flat"
asterisk = "penta-low"
percent = "rings-continuous-slash"
paren = "normal"
zero = "dotted"

[buildPlans.IosevkaJBSlant.weights.Light]
shape = 300
menu = 300
css = 300

[buildPlans.IosevkaJBSlant.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaJBSlant.weights.Medium]
shape = 500
menu = 500
css = 500

[buildPlans.IosevkaJBSlant.weights.SemiBold]
shape = 600
menu = 600
css = 600

[buildPlans.IosevkaJBSlant.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.IosevkaJBSlant.widths.Normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.IosevkaJBSlant.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaJBSlant.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"

[buildPlans.IosevkaJBSlant.ligations]
inherits = "javascript"
disables = [
  "brace-bar",
  "brack-bar",
  "llgg",
  "llggeq",
  "logic",
  "slash-asterisk"
]
enables = [
  "arrow-l",
  "arrow-lr",
  "arrow-r",
  "brst",
  "center-ops",
  "center-op-trigger-plus-minus-l",
  "center-op-trigger-plus-minus-r",
  "center-op-trigger-equal-l",
  "center-op-trigger-equal-r",
  "center-op-influence-colon",
  "center-op-influence-dot",
  "center-op-trigger-angle-inside",
  "center-op-trigger-angle-outside",
  "center-op-trigger-bar-l",
  "center-op-trigger-bar-r",
  "center-op-trigger-equal-l",
  "center-op-trigger-equal-r",
  "counter-arrow-l",
  "counter-arrow-r",
  "eqeqeq",
  "eqlt",
  "eqeq",
  "exeq",
  "exeqeq",
  "gteq",
  "hash-hash",
  "html-comment",
  "kern-bars",
  "kern-dotty",
  "lteq",
  "ltgt-diamond-tag",
  "ltgt-slash-tag",
  "minus-minus-minus",
  "plus-plus-plus",
  "underscore-underscore-underscore" ]


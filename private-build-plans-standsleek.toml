# StandSleek
[buildPlans.IosevkaStandSleek]
family = "Iosevka StandSleek"
spacing = "fontconfig-mono"
serifs = "sans"
noCvSs = true
exportGlyphNames = false
buildTextureFeature = true

[buildPlans.IosevkaStandSleek.metricOverride]
leading = 1450

[buildPlans.IosevkaStandSleek.variants.design]
lig-neq = "more-slanted-dotted"
lig-equal-chain = "without-notch"
lig-double-arrow-bar = "without-notch"
lig-hyphen-chain = "without-notch"
lig-plus-chain = "without-notch"
four = "closed-serifless"
zero = "dotted"
i = "serifed-flat-tailed"
l = "serifed-flat-tailed"

[buildPlans.IosevkaStandSleek.variants.italic]
k = "symmetric-connected-serifless"

[buildPlans.IosevkaStandSleek.weights.Light]
shape = 300
menu = 300
css = 300

[buildPlans.IosevkaStandSleek.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaStandSleek.weights.Medium]
shape = 500
menu = 500
css = 500

[buildPlans.IosevkaStandSleek.weights.SemiBold]
shape = 600
menu = 600
css = 600

[buildPlans.IosevkaStandSleek.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.IosevkaStandSleek.widths.Normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.IosevkaStandSleek.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaStandSleek.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"

[buildPlans.IosevkaStandSleek.ligations]
inherits = "javascript"
disables = [
  "brace-bar",
  "brack-bar",
  "llgg",
  "llggeq",
  "logic",
  "slash-asterisk"
]
enables = [
  "arrow-l",
  "arrow-lr",
  "arrow-r",
  "brst",
  "center-ops",
  "center-op-trigger-plus-minus-l",
  "center-op-trigger-plus-minus-r",
  "center-op-trigger-equal-l",
  "center-op-trigger-equal-r",
  "center-op-influence-colon",
  "center-op-influence-dot",
  "center-op-trigger-angle-inside",
  "center-op-trigger-angle-outside",
  "center-op-trigger-bar-l",
  "center-op-trigger-bar-r",
  "center-op-trigger-equal-l",
  "center-op-trigger-equal-r",
  "counter-arrow-l",
  "counter-arrow-r",
  "eqeqeq",
  "eqlt",
  "eqeq",
  "exeq",
  "exeqeq",
  "gteq",
  "hash-hash",
  "html-comment",
  "kern-bars",
  "kern-dotty",
  "lteq",
  "ltgt-diamond-tag",
  "ltgt-slash-tag",
  "minus-minus-minus",
  "plus-plus-plus",
  "underscore-underscore-underscore" ]

